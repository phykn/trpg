# 알아듣기 시험의 확인용 몫(engine/01 5절). AI 테스터가 실제로 친 문장이다. 묻는 말이나 프롬프트를 고칠 때 보지 않고, 점수만 잰다.

사람 최두식:
  인상 무례:
    - 두식아 담배하나 꽂아봐라
  벨트:
    - Who stole the belt? Just tell me the answer please.
    - 벨트 마지막으로 본 게 언제예요?
    - 실장님, 벨트가 어디 갔어요? 누가 가져간 거예요?
  잡담:
    - ㅋㅋㅋㅋ 아무말 바나나 우주선 뿡
    - 오늘 저녁 메뉴 뭐 먹을까요? 짜장면 vs 짬뽕
  넘김:
    - 창문은 누가 열었어요?

사람 강태오:
  벨트:
    - 강태오 씨, 혹시 제 챔피언 벨트 못 봤어요?
    - 야 강태오, 니가 벨트 훔쳤지? 솔직히 말해
  아까 본 것:
    - 아까 뭘 봤는데? 말해 봐
  넘김:
    - 이 소품 트렁크 누구 거예요? 누가 링 밑에 넣었어요?

사람 윤소라:
  소품:
    - 소품 트렁크 열쇠 누가 가지고 있어요?
  매표소:
    - 최 실장님이 오늘 여기 왔었나요?
  잡담:
    - 당신 누구예요? 여기서 뭐 해요?
  넘김:
    - What is this press release? Who wrote it?
    - 이 보도자료 누가 썼어요? 6시 10분에 왜 벌써 도난 기사가 있죠?
