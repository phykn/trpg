# 알아듣기 시험(engine/01 5절). 모양은 scenarios/dawn/evals.yaml과 같다. 물음 몇은 AI 테스터가 실제로 친 말이다.

사람 최두식:
  인상 다정:
    - 실장님, 오늘 저녁은 드셨어요?
    - 형님 요즘 허리는 좀 괜찮아요?
  인상 위로:
    - 실장님도 많이 놀라셨죠. 실장님 탓 아니에요.
    - 형님, 너무 걱정 마. 내가 어떻게든 해 볼게.
  인상 칭찬:
    - 역시 실장님 아니면 이 바닥 못 버텨요.
    - 형님 수완 하나는 알아줘야 돼.
  인상 선물:
    - 실장님 담배 한 대 태우세요.
    - 이따 경기 끝나면 내가 소주 살게.
  인상 무례:
    - 야, 커피나 타 와.
    - 늙은이가 말이 많네. 꺼져.
  인상 의심:
    - 실장님이 벨트 빼돌린 거 아니에요?
    - 형님, 솔직히 형님이 가져갔지?
  인상 위협:
    - 바른대로 안 대면 링 위에서처럼 메다꽂는다.
    - 형님, 계속 거짓말하면 나 무슨 짓 할지 몰라.
  인상 옛정:
    - 형님, 우리 처음 만났을 때 기억나? 그 동네 체육관.
    - 열다섯 해 동안 형님이랑 별일 다 겪었잖아요.
  인상 없음:
    - 벨트는 언제 없어진 거예요?
    - 경기는 예정대로 하는 거예요?
    - 대기실 열쇠는 누가 가지고 있어요?
  둘러봄:
    - 대기실을 좀 둘러볼게요.
    - 바닥에 뭐 떨어진 거 없나 살펴본다.
    - 쇠 구둣주걱을 집어 들고 살핀다.
  벨트:
    - {말: "뭐가?", 앞의 말: "봉식아, 큰일 났다! 그게 없어졌어!"}
    - {말: "뭐가 없어졌는데요?", 앞의 말: "봉식아, 큰일 났다! 그게 없어졌어!"}
    - 벨트는 언제 없어진 거예요?
    - 누가 가져간 것 같아요?
  6시 반:
    - {말: "그래서요?", 앞의 말: "6시 반 얘기라면 나도 아는 게 좀 있지."}
    - {말: "뭔데요, 말해 봐요.", 앞의 말: "6시 반 얘기라면 나도 아는 게 좀 있지."}
    - 실장님 6시부터 7시까지 어디 계셨어요?
    - 실장님은 그동안 어디 계셨어요? 매표소에 계셨어요?
    - 벨트 없어질 때 실장님은 뭐 하고 계셨어요?
    - 6시 반엔 뭐 하셨어요? 전화하고 계셨어요?
  오늘 경기:
    - 경기는 예정대로 하는 거예요?
  잡담:
    - {말: "아 배고프다. 실장님 밥은 먹었어요?", 앞의 말: "벨트는 6시까지 케이스에 있었어."}
    - 실장님, 바나나우유 드실래요?
    - 두식아 담배하나 꽂아봐라
    - 후.... 내가 이자리 까지 어떻게 올라왔는지 아냐
  곳 경기장:
    - 링 쪽으로 가 볼게요.
  행동 몰아세운다:
    - 최두식을 팬다
    - 최두식의 멱살을 잡는다.
  행동 달랜다:
    - 최두식의 등을 두드리며 진정시킨다.
    - 형님, 한 번만 봐 달라고 사정한다.
  행동 속인다:
    - 경찰이 벌써 다 안다고 최두식을 떠본다.
    - 윤소라가 실장님을 봤다더라고 넘겨짚는다.

사람 강태오:
  인상 도발:
    - 링 위에서 붙으면 넌 3분도 못 버텨.
    - 아이언 강? 이름만 거창하네. 이따 보자.
  인상 위협:
    - 너 벨트 건드렸으면 오늘 밤 병원 신세 질 줄 알아.
  인상 칭찬:
    - 근육 좋네, 준비 많이 했구나.
  인상 없음:
    - 아까 대기실 앞에서 누구 못 봤어?
    - 언제부터 경기장에 있었어?
  벨트:
    - {말: "그래, 그거.", 앞의 말: "벨트 말이냐? 흥."}
    - 너 벨트 가져갔지?
  6시 반:
    - {말: "뭔데?", 앞의 말: "6시 반? 그때 일이라면 나도 할 말 있지."}
    - 아까 대기실 앞에서 누구 못 봤어?
    - 최 실장 아까 봤어? 어디 있었어?
  잡담:
    - 몸 좋으시네요. 운동 얼마나 하셨어요?
  넘김:
    - 윤소라 씨는 어떤 사람이야?
  행동 몰아세운다:
    - 강태오를 링 줄에 밀어붙인다.
    - 강태오의 턱을 한 대 친다.
  행동 달랜다:
    - 강태오 어깨를 주무르며 진정시킨다.
    - 태오야, 제발 도와줘, 하고 사정한다.
  행동 속인다:
    - CCTV에 다 찍혔다고 강태오를 떠본다.
    - 최 실장이 너를 지목했다고 거짓말한다.
  행동 잠김:
    - 트렁크를 비틀어 연다
    - 머리핀으로 트렁크 자물쇠를 딴다.

사람 윤소라:
  인상 위로:
    - 소라 씨, 많이 놀랐죠? 소라 씨 잘못 아니에요.
    - 괜찮아요, 아무도 소라 씨 탓 안 해요.
  인상 다정:
    - 소라 씨, 오늘 고생 많아요. 밥은 먹었어요?
  인상 무례:
    - 막내가 뭘 안다고 끼어들어.
  인상 의심:
    - 소라 씨가 트렁크 열쇠 갖고 있죠? 수상한데.
  인상 없음:
    - 표는 몇 장이나 팔렸어요?
  둘러봄:
    - 매표소 안을 둘러본다.
  매표소:
    - {말: "어떤데요?", 앞의 말: "매표소 일이라면 제가 좀 알아요."}
    - 매표소는 누가 보고 있었어요?
    - 여기는 몇 시에 문 열었어요?
  소품:
    - 소품 트렁크에는 뭘 넣어 둬요?
  행동 몰아세운다:
    - 윤소라의 손목을 확 잡아챈다.
    - 매표소 창을 주먹으로 치며 윤소라를 다그친다.
  행동 달랜다:
    - 윤소라 손을 잡고 괜찮다고 달랜다.
    - 소라 씨, 부탁이에요, 하고 사정한다.
  행동 속인다:
    - 실장님이 소라 씨 탓이라던데요, 하고 떠본다.
    - 트렁크 열쇠는 이미 찾았다고 속인다.

곳 경기장:
  행동 잠김:
    - 트렁크를 비틀어 연다
    - 머리핀으로 트렁크 자물쇠를 딴다.
  둘러봄:
    - 강태오를 링 줄에 밀어붙인다.
    - 강태오의 턱을 한 대 친다.
