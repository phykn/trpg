# 알아듣기 시험(engine/01 5절). 모양은 scenarios/dawn/evals.yaml과 같다. 물음 몇은 AI 테스터가 실제로 친 말이다.

사람 최두식:
  둘러봄:
    - 대기실을 좀 둘러볼게요.
    - 바닥에 뭐 떨어진 거 없나 살펴본다.
  벨트:
    - 벨트는 언제 없어진 거예요?
    - 누가 가져간 것 같아요?
  그 시각:
    - 실장님 6시부터 7시까지 어디 계셨어요?
    - 실장님은 그동안 어디 계셨어요? 매표소에 계셨어요?
    - 벨트 없어질 때 실장님은 뭐 하고 계셨어요?
  오늘 경기:
    - 경기는 예정대로 하는 거예요?
  잡담:
    - 실장님, 바나나우유 드실래요?
  곳 경기장:
    - 링 쪽으로 가 볼게요.

사람 강태오:
  벨트:
    - 너 벨트 가져갔지?
  아까 본 것:
    - 아까 대기실 앞에서 누구 못 봤어?

사람 윤소라:
  둘러봄:
    - 매표소 안을 둘러본다.
  매표소:
    - 매표소는 누가 보고 있었어요?
  소품:
    - 소품 트렁크에는 뭘 넣어 둬요?
