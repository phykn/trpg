머리:
  이름: arena
  제목: "프롤로그: 사라진 벨트"
  도입: 프로레슬러 김봉식, 당신은 오늘 밤 아홉 시 타이틀 방어전을 앞두고 있습니다. 편의점에서 바나나우유를 사 들고 대기실에 돌아오니, 챔피언 벨트 케이스가 비어 있습니다. 매니저 최 실장이 소리칩니다. 공이 울리기 전에 누가 벨트를 가져갔는지 밝혀야 합니다.
  시작하는 곳: 대기실
  칸 수: 10
  시각: {시작: "19:00", 한 칸: 12}
  진실: {누가: 최두식, 어떻게: 링 밑 트렁크, 왜: 도난 소동}

사실:
  매표소를 비운 매니저: 최두식은 6시 반 무렵 매표소에 없었다.
  링 밑 트렁크: 벨트는 링 밑 소품 트렁크에 잠겨 있었다.
  도난 소동: 최두식은 벨트 도난 소동으로 오늘 경기를 기사에 띄우려 했다.

성질:
  - 납작하고 단단하다

곳:
  대기실:
    모습: 체육관 지하의 좁은 대기실이다. 형광등 하나가 깜박이고, 벽에는 지난 경기 포스터가 겹겹이 붙어 있다.
    이어진 곳: [경기장]
  경기장:
    모습: 접이식 의자 수백 개가 링을 둘러싼 체육관이다. 객석은 아직 듬성듬성 비어 있고, 링 위로 조명이 하얗게 쏟아진다.
    이어진 곳: [매표소]
  매표소:
    모습: 체육관 입구의 유리 칸막이 매표소다. 탁자에 표 묶음과 노트북 한 대가 놓여 있다.

볼 것:
  빈 벨트 케이스:
    곳: 대기실
    줄: 벨트 케이스가 열린 채 비어 있었다. 자물쇠에는 긁힌 자국 하나 없었다.
  열린 창문:
    곳: 대기실
    줄: 대기실 창문이 한 뼘쯤 열려 있었다. 창밖은 체육관 뒤 주차장이다.
  쇠 구둣주걱:
    곳: 대기실
    물건인가: 예
    소개: 대기실에 굴러다니던 긴 쇠 구둣주걱.
    성질: [납작하고 단단하다]
  소품 트렁크:
    곳: 경기장
    줄: 링 밑에 소품 트렁크가 밀려 들어가 있었다. 걸쇠에 작은 자물쇠가 걸려 있었다.
    잠김:
      약점: 납작하고 단단하다
      단단한가: 예
      주인: 최두식
      실마리: 걸쇠 틈이 벌어져 있다. 납작한 쇠붙이를 끼우면 젖혀지겠다.
      안에 든 것: [챔피언 벨트]
  챔피언 벨트:
    줄: 트렁크 속 소품 깃발 밑에 챔피언 벨트가 들어 있었다.
    보여 주는 사실: 링 밑 트렁크
  보도자료:
    곳: 매표소
    줄: '노트북에 보도자료가 열려 있었다. "[단독] 챔피언 벨트 도난!" 저장 시각은 오후 6시 10분이었다.'
    보여 주는 사실: 도난 소동
  일자 드라이버:
    곳: 매표소
    물건인가: 예
    소개: 손잡이가 닳은 일자 드라이버.
    성질: [납작하고 단단하다]

사람:
  최두식:
    신상: 쉰 줄의 매니저. 플레이어 김봉식과 열다섯 해를 함께했다. 말이 빠르고, "봉식아"를 입에 달고 산다.
    소개: 쉰 줄의 매니저. 당신과 열다섯 해를 함께했다.
    있는 곳: 대기실
    화제:
      벨트:
        자세: 숨기지 않는다
        참말:
          말: 벨트는 6시까지 케이스에 있었다. 링에 있는 강태오가 제일 수상하다.
          알리는 것: [강태오, 경기장]
        묻는 말:
          - 벨트는 언제까지 있었습니까?
          - 누가 벨트를 가져간 것 같습니까?
          - 케이스를 마지막으로 본 게 언제입니까?
      그 시각:
        자세: 거짓말한다
        거짓말: 6시 반부터 7시까지 나는 매표소에서 표를 팔았다.
        깨는 사실: 매표소를 비운 매니저
        깨진 뒤:
          말: 매표소에는 없었다. 기자한테 벨트가 없어졌다고 미리 귀띔해 뒀다, 기사가 나면 표가 팔리니까.
          보여 주는 사실: 도난 소동
        묻는 말:
          - 6시 반에 어디 계셨습니까?
          - 실장님은 그동안 어디에 계셨습니까?
          - 벨트가 없어질 때 뭘 하셨습니까?
          - 그때 매표소에 계셨습니까?
      오늘 경기:
        자세: 숨기지 않는다
        참말: 아홉 시 공이 울리면 경기는 그대로 간다. 벨트 없이 링에 오르면 챔피언 체면이 말이 아니다.
        묻는 말:
          - 경기는 어떻게 됩니까?
          - 벨트 없이도 시합을 합니까?
          - 공은 몇 시에 울립니까?
  강태오:
    신상: 스물여덟의 도전자. 링 이름은 '아이언 강'. 덩치가 크고 말끝마다 코웃음을 친다.
    소개: 스물여덟의 도전자. 링 이름은 '아이언 강'이다.
    있는 곳: 경기장
    처음 태도: {믿음: -1}
    화제:
      벨트:
        자세: 숨기지 않는다
        참말: 그 벨트는 오늘 밤 링 위에서 내가 가져간다. 어제 SNS에도 그렇게 썼다.
        묻는 말:
          - 벨트를 가져갔습니까?
          - 벨트가 탐나지 않습니까?
          - 챔피언 자리를 노리고 있습니까?
      아까 본 것:
        자세: 숨기지 않는다
        참말:
          말: 6시 반쯤 대기실 앞을 지나는데 최 실장이 안에서 나오더라.
          보여 주는 사실: 매표소를 비운 매니저
          알리는 것: [최두식, 대기실]
        묻는 말:
          - 오늘 저녁에 뭘 봤습니까?
          - 대기실 쪽에 누가 있었습니까?
          - 6시 반쯤 어디를 지나갔습니까?
  윤소라:
    신상: 스물셋의 막내 직원. 표도 팔고 조명과 소품도 맡는다. 말끝을 "요"로 맺고, 눈치가 빠르다.
    소개: 스물셋의 막내 직원. 표를 팔고 조명과 소품을 맡는다.
    있는 곳: 매표소
    화제:
      매표소:
        자세: 숨기지 않는다
        참말:
          말: 6시 45분에 와 보니 매표소 셔터가 내려져 있었다. 그 뒤로는 내가 혼자 표를 팔았다.
          보여 주는 사실: 매표소를 비운 매니저
        묻는 말:
          - 매표소는 누가 지켰습니까?
          - 표는 언제부터 팔았습니까?
          - 셔터는 언제 올렸습니까?
      소품:
        자세: 꺼린다
        풀린 뒤:
          말: 6시 반쯤 조명을 보다가, 실장님이 링 밑 소품 트렁크에 뭘 넣고 잠그는 걸 봤다.
          보여 주는 사실: 링 밑 트렁크
          알리는 것: [최두식]
        바라는 것: 매표소를 비운 매니저
        실마리: 실장님이 정말 내내 매표소에 계셨다면, 저는 할 말이 없어요.
        묻는 말:
          - 경기장에서 이상한 걸 못 봤습니까?
          - 소품은 어디에 둡니까?
          - 조명이나 소품 쪽에 누가 다녀갔습니까?

번진 일:
  - 때: 6
    일:
      - 없어진다: 보도자료
    막는 조건: 거짓말 최두식.그 시각
    조짐: 복도에서 최 실장이 누군가와 통화하는 목소리가 들린다. "그래, 기사는 내가 보낸 대로."
    벌어졌을 때: 매표소 노트북의 보도자료는 어느새 지워져 있었다.
    막았을 때: 들통난 최 실장의 노트북에는 보도자료가 그대로 남아 있었다.

결말:
  다 밝혔다: 공이 울리기 전, 당신은 링 밑 트렁크에서 꺼낸 벨트를 치켜들고 최 실장의 자작극을 관객 앞에 밝힌다. 최 실장은 머리를 긁적이며 고개를 숙인다.
  누구인지는 밝혔다: 당신은 최 실장을 짚었지만 그림 한쪽이 비어 있다. 최 실장은 끝까지 너스레를 떨며 웃어넘긴다.
  엉뚱한 사람을 짚었다: 당신이 짚은 사람이 억울하다며 자리를 뜨고, 최 실장은 뒤에서 웃음을 참는다.
  밝히지 못했다: 공이 울리고, 다음 날 "챔피언 벨트 도난" 기사는 최 실장의 뜻대로 난다.
  진실 풀이: 최두식은 텅 빈 객석을 채우려고 벨트 도난 소동을 꾸몄다. 오후 6시 10분에 보도자료를 미리 써 두고, 6시 반 당신이 편의점에 간 사이 케이스를 열쇠로 열어 벨트를 링 밑 소품 트렁크에 잠갔다. 그날 밤 경기를 마친 당신은 쫄쫄이 타이츠에 벨트를 찬 채 체육관 뒷문을 나섰다. 골목 끝에서 트럭의 헤드라이트가 쏟아졌다.
