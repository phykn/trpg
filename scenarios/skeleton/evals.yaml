# 알아듣기 시험(engine/01 5절)의 가장 작은 본. 모양은 scenarios/dawn/evals.yaml과 같다.

사람 오토:
  인상 다정:
    - 경비 양반, 밤새 고생 많았소.
  인상 무례:
    - 경비면 경비답게 일이나 하시오.
  인상 없음:
    - 어젯밤에 뭘 봤소?
  둘러봄:
    - 광장을 한번 둘러본다.
  밤:
    - 간밤에 수상한 사람이 지나가지 않았습니까?
    - 밤에 누구 봤습니까? 몇 시쯤 봤습니까?
  씨앗:
    - 없어진 자루에는 무슨 씨앗이 들었습니까?
  밤 + 씨앗:
    - 어젯밤에 본 것과 사라진 씨앗이 어떤 것인지 말해 주십시오.
  잡담:
    - 좋은 아침입니다.
  곳 방앗간:
    - 방앗간으로 가겠습니다.

사람 한스:
  인상 위협:
    - 바른대로 안 대면 목을 비틀겠소.
  인상 의심:
    - 당신이 곡물을 빼돌린 거지?
  인상 없음:
    - 그날 밤 어디 있었소?
  그날 밤:
    - 간밤에 어디서 무엇을 했습니까?
    - 어젯밤 여기 문은 잠겨 있었습니까?
  잡담:
    - 창고가 꽤 크군요.

사람 리사:
  인상 위로:
    - 리사, 무서웠지? 네 잘못 아니야.
  인상 사탕:
    - 리사, 이 꿀과자 먹을래?
  인상 없음:
    - 새벽에 뭘 봤니?
  새벽:
    - 새벽에 밖에서 뭘 봤니?
  잡담:
    - 어머니는 어디 가셨니?
  넘김:
    - 오토 아저씨는 어떤 분이니?

곳 광장:
  곳 곡물 창고:
    - 곡물 창고에 들어가 본다.
