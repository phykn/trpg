# 해석 평가 문장(story.md 6절). 원고가 아니라 시험 자료이고 시작 시 검증에 들지 않습니다.
# at: 증인 길 path의 걸음 step개를 실행한 뒤의 상태. then이 있으면 그 행동들(증인 걸음과 같은 꼴)을 더 실행한 뒤.
# expect: 행동 id 하나(첫 단계), 행동 id의 목록(이어지는 단계들), 스키마 이름(첫 단계가 그 스키마의 아무 행동), refused, clarify, idle 중 하나.
# 굴리는 행동의 기댈 것은 0층의 이름 맞추기가 정한 굴림 카드의 기본값으로 비교합니다.
# relies: 첫 굴림 카드가 내놓는 기댈 것들. known: 알려진 실패와 그 까닭이고, 표시 없는 실패는 회귀라 평가가 실패합니다.

