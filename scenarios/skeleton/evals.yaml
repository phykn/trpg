# 알아듣기 시험(engine/01 5절)의 가장 작은 본. 모양은 scenarios/dawn/evals.yaml과 같다.

사람 오토:
  인상 다정:
    - 경비 양반, 밤새 고생 많았소.
  인상 무례:
    - 경비면 경비답게 일이나 하시오.
  인상 없음:
    - 어젯밤에 뭘 봤소?
  둘러봄:
    - 광장을 한번 둘러본다.
  밤:
    - 간밤에 수상한 사람이 지나가지 않았습니까?
    - 밤에 누구 봤습니까? 몇 시쯤 봤습니까?
  씨앗:
    - 없어진 자루에는 무슨 씨앗이 들었습니까?
  밤 + 씨앗:
    - 어젯밤에 본 것과 사라진 씨앗이 어떤 것인지 말해 주십시오.
  잡담:
    - 좋은 아침입니다.
  곳 방앗간:
    - 방앗간으로 가겠습니다.
  행동 몰아세운다:
    - 오토의 멱살을 잡는다.
    - 탁자를 쾅 치며 오토를 노려본다.
  행동 달랜다:
    - 오토의 어깨를 토닥이며 진정시킨다.
    - 제발 도와주세요, 하고 오토에게 사정한다.
  행동 속인다:
    - 이미 다 알고 왔다고 오토를 떠본다.
    - 한스가 다 불었다고 거짓말을 한다.

사람 한스:
  인상 위협:
    - 바른대로 안 대면 목을 비틀겠소.
  인상 의심:
    - 당신이 곡물을 빼돌린 거지?
  인상 없음:
    - 그날 밤 어디 있었소?
  그날 밤:
    - 간밤에 어디서 무엇을 했습니까?
    - 어젯밤 여기 문은 잠겨 있었습니까?
  잡담:
    - 창고가 꽤 크군요.
  행동 몰아세운다:
    - 한스를 벽으로 밀어붙인다.
    - 한스의 팔을 비틀어 잡는다.
  행동 달랜다:
    - 한스 손을 잡고 괜찮다고 다독인다.
    - 한스에게 무릎을 꿇고 부탁한다.
  행동 속인다:
    - 오토가 당신을 봤다더라고 넘겨짚는다.
    - 경비대가 곧 온다고 한스를 속인다.
  행동 잠김:
    - 뒷문을 어깨로 들이받는다.
    - 철사로 자물쇠를 딴다.

사람 리사:
  인상 위로:
    - 리사, 무서웠지? 네 잘못 아니야.
  인상 사탕:
    - 리사, 이 꿀과자 먹을래?
  인상 없음:
    - 새벽에 뭘 봤니?
  새벽:
    - 새벽에 밖에서 뭘 봤니?
  잡담:
    - 어머니는 어디 가셨니?
  넘김:
    - 오토 아저씨는 어떤 분이니?
  행동 몰아세운다:
    - 리사를 붙잡고 흔든다.
    - 리사에게 주먹을 들어 보인다.
  행동 달랜다:
    - 리사 머리를 쓰다듬으며 달랜다.
    - 무서워하지 말라고 리사를 안아 준다.
  행동 속인다:
    - 엄마가 다 말해도 된다고 했다고 리사를 꾄다.
    - 말해 주면 상을 준다고 리사를 속인다.

곳 곡물 창고:
  행동 잠김:
    - 뒷문을 어깨로 들이받는다.
    - 철사로 자물쇠를 딴다.
  둘러봄:
    - 한스의 팔을 비틀어 잡는다.
    - 한스를 벽으로 밀어붙인다.

곳 광장:
  곳 곡물 창고:
    - 곡물 창고에 들어가 본다.
