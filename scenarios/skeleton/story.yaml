머리:
  이름: skeleton
  제목: "Dev: 사라진 씨앗 자루"
  도입: 봄에 뿌릴 씨앗 자루가 밤사이 마을 창고에서 사라졌다. 날이 밝으면 장이 서고, 씨앗은 남의 손에 팔려 간다. 그 전에 누가 가져갔는지 밝혀야 한다.
  시작하는 곳: 광장
  칸 수: 8
  시각: {시작: "04:00", 한 칸: 30}
  진실: {누가: 한스, 어떻게: 뒷문으로 실어 냄, 왜: 노름빚}

사실:
  자리를 비운 창고지기: 한스는 자정 무렵 창고를 비웠다.
  뒷문으로 실어 냄: 씨앗 자루는 창고 뒷문으로 실려 나갔다.
  노름빚: 한스는 노름빚에 쫓기고 있었다.

성질:
  - 납작하고 단단하다

곳:
  광장:
    모습: 우물과 장대가 선 작은 광장이다. 새벽 안개가 낮게 깔려 있다.
    이어진 곳: [곡물 창고, 방앗간]
  곡물 창고:
    화면 이름: 창고
    모습: 마을의 곡식을 모아 두는 나무 창고다. 앞문은 열려 있고 안은 어둡다.
  방앗간:
    모습: 개울가의 물레방앗간이다. 물레가 삐걱거리며 돈다.
    나오는 조건: 말 오토.밤.참말

볼 것:
  쇠 지렛대:
    곳: 광장
    물건인가: 예
    성질: [납작하고 단단하다]
  꺼진 등잔:
    곳: 곡물 창고
    줄: 창고 앞 등잔에 기름이 그대로 남아 있었다. 밤새 켜지 않은 것이다.
    보여 주는 사실: 자리를 비운 창고지기
  잠긴 뒷문:
    곳: 곡물 창고
    줄: 창고 뒷문에 자물쇠가 걸려 있었다.
    잠김:
      약점: 납작하고 단단하다
      단단한가: 예
      주인: 한스
      실마리: 빗장 틈이 넓다. 납작한 쇠붙이라면 들어가겠다.
      안에 든 것: [수레 자국]
  수레 자국:
    줄: 뒷문 밖 진흙에 무거운 수레가 지나간 자국이 있었다.
    보여 주는 사실: 뒷문으로 실어 냄
  빈 자루 더미:
    곳: 방앗간
    줄: 방앗간 마당에 빈 자루가 수북이 쌓여 있었다.
  빚 문서:
    곳: 방앗간
    줄: 방앗간 뒤 탁자에 한스의 이름이 적힌 빚 문서가 있었다.
    보여 주는 사실: 노름빚
    알리는 것: [한스]
    나오는 조건: 볼 것 빈 자루 더미

사람:
  오토:
    신상: 마을 경비. 쉰 줄의 무뚝뚝한 사내로, 말끝마다 "그렇지"를 붙인다.
    있는 곳: 광장
    화제:
      밤:
        자세: 숨기지 않는다
        참말:
          말: 자정쯤 한스가 등불도 없이 방앗간 쪽으로 가는 걸 봤다.
          보여 주는 사실: 자리를 비운 창고지기
          알리는 것: [한스, 방앗간]
        묻는 말:
          - 어젯밤에 무슨 일 없었습니까?
          - 밤에 지나간 사람을 봤습니까?
      씨앗:
        자세: 숨기지 않는다
        참말: 그 씨앗은 봄에 온 마을이 나눠 뿌릴 몫이다.
        묻는 말:
          - 사라진 씨앗은 어떤 것입니까?
  한스:
    신상: 창고지기. 마흔 남짓의 마른 사내로, 눈을 자주 깜박인다.
    있는 곳: 곡물 창고
    처음 태도: {믿음: -1}
    화제:
      그날 밤:
        자세: 거짓말한다
        거짓말: 밤새 창고 앞을 지켰다. 아무도 오지 않았다.
        깨는 사실: 자리를 비운 창고지기
        깨진 뒤:
          말: 자정에 방앗간 뒤에서 노름을 했다. 빚이 늘어 갚을 길이 없었다.
          보여 주는 사실: 노름빚
          알리는 것: [방앗간]
        묻는 말:
          - 어젯밤에 어디 있었습니까?
  리사:
    신상: 방앗간 주인의 딸. 열여섯 살로, 낯선 사람 앞에서 말을 더듬는다.
    있는 곳: 방앗간
    화제:
      새벽:
        자세: 꺼린다
        풀린 뒤:
          말: 새벽에 한스 아저씨가 창고 뒷문으로 자루를 실어 내는 걸 봤다.
          보여 주는 사실: 뒷문으로 실어 냄
          알리는 것: [한스]
        바라는 것: 자리를 비운 창고지기
        실마리: 창고지기가 정말 밤새 창고를 지켰을까요?
        묻는 말:
          - 새벽에 무엇을 봤니?
        나오는 조건: 볼 것 꺼진 등잔

번진 일:
  - 때: 5
    일:
      - 옮긴다: [한스, 방앗간]
      - 없어진다: 빚 문서
      - 떠난다: 리사
    막는 조건: 거짓말 한스.그날 밤
    조짐: 방앗간 쪽에서 종이 타는 냄새가 바람에 실려 온다.
    벌어졌을 때: 빚 문서는 아궁이에서 재가 되었고, 겁먹은 리사는 이웃 마을로 떠났다.
    막았을 때: 거짓말이 들통난 한스는 창고 앞에 붙들려 있었다.

결말:
  다 밝혔다: 장이 서기 전에 당신은 한스의 이름과 뒷문의 수레 자국, 노름빚을 마을 사람들 앞에 내놓는다.
  누구인지는 밝혔다: 당신은 한스를 짚었지만 어떻게, 왜가 비어 있다. 한스는 끝까지 고개를 젓는다.
  엉뚱한 사람을 짚었다: 당신이 짚은 사람이 끌려가는 동안, 한스는 창고 문을 조용히 닫는다.
  밝히지 못했다: 장이 서고, 씨앗 자루는 낯선 수레에 실려 마을을 떠난다.
  진실 풀이: 한스는 노름빚에 쫓기다 자정에 창고를 비우고 방앗간 뒤 노름판에 갔다. 새벽에 돌아와 씨앗 자루를 뒷문으로 실어 내 장사꾼에게 넘기려 했다. 등잔을 켜지 않은 것도 그 때문이다.
