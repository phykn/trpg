# 알아듣기 시험(engine/01 5절). 이야기가 아니라 시험 자료이고, 켜질 때 검사하지 않는다.
# 첫 키는 묻는 자리다. "사람 X"는 X가 있는 곳에서 X에게, "곳 X"는 상대 없이 X에서.
# 둘째 키는 기대하는 보기다. 화제 이름, 화제 둘("A + B"), 잡담, 넘김, 옮겨 갈 "곳 X".
# 수첩에는 이야기의 줄이 모두 적혀 있다고 친다. 화제와 갈 곳의 보기가 가장 많은 때다.

사람 고드릭:
  둘러봄:
    - 사당 안을 좀 둘러보겠습니다.
    - 제단 주변을 살펴봅니다.
  징수관:
    - 세금 걷으러 온 나리는 언제 마을을 떠났습니까?
    - 어제 징수관과 만나셨습니까?
    - 징수관이 마을에 와서 무엇을 했습니까?
  그 뒤의 일:
    - 술자리가 끝나고 그 사람은 어디로 갔습니까?
    - 징수관이 댁을 나선 뒤에 무슨 일이 있었습니까?
  새벽 종:
    - 종이 울리면 무슨 일이 생깁니까?
    - 영주의 기사들은 언제 옵니까?
  마을 살림:
    - 올해 농사는 어땠습니까?
    - 마을 사람들 살림이 어렵습니까?
  징수관 + 새벽 종:
    - 징수관이 언제 떠났는지, 그리고 새벽 종이 울리면 어떻게 되는지 알려 주십시오.
  잡담:
    - 안녕하십니까, 촌장님.
    - 연세가 어떻게 되십니까?
  넘김:
    - 토빈이라는 아이를 아십니까?
  곳 숲길:
    - 숲길로 가 보겠습니다.
  곳 여관 물레방아:
    - 여관에 들러야겠습니다.

사람 마렌:
  아버지의 저녁:
    - 어젯밤 촌장님은 어디 계셨어요?
    - 아버님은 저녁 내내 무엇을 하셨습니까?
    - 저녁에 아버지가 집에 계셨나요?
  마당:
    - 오늘 집에 무슨 일 없었어요?
    - 수레는 요즘 누가 씁니까?
  아버지의 저녁 + 마당:
    - 아버지가 저녁에 어디 계셨는지, 오늘 집에 별일은 없었는지 말해 주세요.
  잡담:
    - 집이 참 넓네요.
    - 차 한 잔 얻어 마실 수 있을까요?
  넘김:
    - 숲길의 시신을 보셨습니까?
  곳 여관 물레방아:
    - 여관으로 돌아가겠습니다.

사람 브람:
  징수관:
    - 징수관이 오늘 여관에 들렀습니까?
    - 어젯밤 세금 걷는 나리가 여기 오지 않았소?
    - 그 징수관이 여기서 술을 마셨습니까?
  독미나리:
    - 독초 같은 건 누가 다룹니까?
    - 이 근처에서 독을 구할 수 있는 데가 있소?
  징수관 + 독미나리:
    - 징수관 얘기랑 독초 얘기 좀 해 주시오.
  잡담:
    - 날씨가 참 춥네요.
    - 주인장 이름이 뭡니까?
    - 여기 맥주 한 잔 주시오.
  넘김:
    - 사당에 불이 꺼져 있던 걸 아십니까?
  곳 마을 사당:
    - 사당으로 가 보겠습니다.
  곳 촌장 집:
    - 촌장 집에 가 봐야겠소.

사람 넬:
  시신:
    - 죽은 징수관을 보셨습니까?
    - 시신에 남은 자국을 어떻게 보십니까?
    - 그 사람이 어떻게 죽은 것 같습니까?
  해 질 녘:
    - 해 질 무렵에 누굴 보셨습니까?
    - 저녁에 징수관이 어디로 가던가요?
  독미나리:
    - 독미나리는 어떤 풀입니까?
    - 요즘 독초를 얻어 간 사람이 있습니까?
    - 입술이 검푸르게 변하는 독이 있습니까?   # qa-5 턴 30
    - 요즘 누가 할머니께 약초를 사 갔습니까?   # qa-1 턴 33
  시신 + 해 질 녘:
    - 시신은 어땠는지, 그리고 저녁에 징수관을 봤는지 알려 주세요.
  잡담:
    - 할머니, 몸은 괜찮으세요?
    - 약초 냄새가 좋네요.
  넘김:
    - 여관 주인은 믿을 만한 사람입니까?
  곳 숲길:
    - 숲길로 돌아가겠습니다.
  곳 마을 사당:
    - 마을 사당에 가야겠어요.

사람 토빈:
  사당:
    - 얘야, 저녁에 사당에 불이 켜져 있었니?
    - 사당 앞을 지나간 적 있니?
  숲길에서 본 것:
    - 그날 밤 숲에서 뭘 봤는지 말해 줄래?
    - 수레 같은 거 지나가는 거 못 봤니?
    - 밤에 이 길로 누가 지나갔니?
  사당 + 숲길에서 본 것:
    - 사당에 가 봤는지랑 숲에서 본 거 다 말해 줘.
  잡담:
    - 몇 살이니?
    - 아버지는 뭐 하시니?
  넘김:
    - 넬 할멈은 어디 사니?
  곳 약초꾼 오두막:
    - 오두막에 가 봐야겠다.
  곳 여관 물레방아:
    - 여관으로 가자.

곳 숲길:
  곳 약초꾼 오두막:
    - 약초꾼 오두막으로 간다.
  곳 마을 사당:
    - 사당으로 돌아간다.
  둘러봄:
    - 주변을 둘러본다.
