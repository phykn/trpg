머리:
  이름: dawn
  제목: "챕터 1: 새벽 종이 울리기 전에"
  도입: 체육관 뒷골목에서 트럭에 치인 당신, 김봉식이 눈을 떠 보니 낯선 세계의 숲길입니다. 눈앞에는 영주의 징수관 에드윈이 죽어 누워 있고, 쫄쫄이 타이츠에 챔피언 벨트를 찬 당신은 그 자리에서 살인범으로 몰렸습니다. 촌장이 선언합니다. 새벽 종이 울리면 영주의 기사들에게 넘기겠다고. 그때까지 결백을 밝혀야 합니다.
  시작하는 곳: 마을 사당
  칸 수: 24
  시각: {시작: "20:00", 한 칸: 20}
  분위기: 옛이야기처럼 낮고 차분한 문장. 젖은 흙과 횃불 그을음 냄새 속에서, 가난한 마을의 의심과 두려움을 과장 없이 그리고, 죽음조차 가끔 건조한 농담으로 비튼다.
  여는 글:
    장면: 저녁 8시, 마을 사당. 벽에 걸린 횃불이 흔들리고 밀랍 타는 냄새가 낮게 깔려 있습니다. 제단 앞 나무 의자에 앉은 고드릭이 지팡이 끝으로 바닥을 두드립니다. 쫄쫄이 타이츠 차림의 당신을 보는 눈길은 죄인보다 구경거리를 보는 쪽에 가깝습니다.
    첫마디: 정신이 드셨구려. 하필 이런 밤에 그런 꼴로 나타나다니, 일이 아주 고약하게 됐소.
  진실: {누가: 고드릭, 어떻게: 독미나리 독, 왜: 빼돌린 세금}

사실:
  독미나리 독: 에드윈은 독미나리 독으로 죽었다.
  빼돌린 세금: 고드릭은 세 해 동안 영주에게 바칠 세금을 빼돌렸다.
  촌장 집의 밤손님:
    문장: 에드윈은 밤에 촌장 집에 갔다.
    때: 밤
    가리킨다: 고드릭
  여관의 징수관:
    문장: 에드윈은 해 질 녘 여관에 들렀다.
    때: 해 질 녘
    가리킨다: 브람
  빈 사당:
    문장: 저녁 내내 사당에는 아무도 없었다.
    때: 저녁 내내
  옮겨진 시신: 에드윈은 숲길이 아닌 곳에서 죽었고, 시신은 수레로 옮겨졌다.
  밤에 나간 수레:
    문장: 촌장 집 수레가 밤에 숲길로 나갔다.
    때: 밤
  조른 자국이 아니다: 에드윈의 목 자국은 손으로 조른 자국이 아니다.
  독초를 아는 넬:
    문장: 이 근방에서 독미나리를 다룰 줄 아는 사람은 넬이다.
    가리킨다: 넬
  지팡이 짚은 사람:
    문장: 시신을 실어 온 사람은 지팡이를 짚고 걸었다.
    범인은 가진다: 지팡이를 짚는다
  오두막의 넬:
    문장: 넬은 저녁 내내 오두막 화롯가를 떠나지 않았다.
    때: 저녁 내내
    벗긴다: 넬

성질:
  - 가늘고 단단하다
  - 지팡이를 짚는다
  - 배가 나왔다

곳:
  마을 사당:
    모습: 마을 한가운데의 작은 돌 사당이다. 제단 앞에 나무 의자가 줄지어 있고, 벽에 걸린 횃불이 흔들린다. 밀랍 타는 냄새가 낮게 깔려 있다.
    이어진 곳: [여관 물레방아, 숲길]
  여관 물레방아:
    모습: 개울가의 이층 여관이다. 커다란 물레가 벽에 붙어 천천히 돌고, 안에서는 시큼한 술 냄새가 난다.
    이어진 곳: [촌장 집]
  촌장 집:
    모습: 마을에서 가장 큰 돌집이다. 넓은 마당과 부엌이 딸려 있고, 창마다 덧문이 닫혀 있다. 부엌 쪽에서 장작 타는 냄새가 새어 나온다.
  숲길:
    모습: 마을에서 숲으로 이어지는 진흙길이다. 양옆으로 전나무가 빽빽하고, 길가에 징수관의 시신이 누워 있다. 축축한 흙과 송진 냄새 사이로 까마귀가 운다.
    이어진 곳: [약초꾼 오두막]
  약초꾼 오두막:
    모습: 숲 가장자리의 낮은 오두막이다. 처마 밑에 말린 풀 다발이 줄줄이 걸려 있고, 안은 쌉쌀한 냄새로 가득하다.

볼 것:
  제단의 초:
    곳: 마을 사당
    줄: 제단의 초가 하나도 타지 않은 채 그대로였다.
    보여 주는 사실: 빈 사당
  목 자국:
    곳: 숲길
    줄: 징수관의 목에 끈에 졸린 듯한 자국이 있었다.
  쓸린 자국:
    곳: 숲길
    줄: 목 자국에 손가락 자국이 없었다. 조른 것이 아니라 가는 끈이 한쪽으로 쓸고 간 자국이었다.
    보여 주는 사실: 조른 자국이 아니다
  검푸른 입술:
    곳: 숲길
    줄: 징수관의 입술이 검푸르게 변해 있었다.
    보여 주는 사실: 독미나리 독
  마른 장화:
    곳: 숲길
    줄: 진흙길인데 징수관의 장화 바닥은 말라 있었다.
    보여 주는 사실: 옮겨진 시신
  바퀴 자국:
    곳: 숲길
    줄: 마을 쪽에서 온 수레 바퀴 자국이 시신 앞에서 끊겨 있었다.
    보여 주는 사실: 옮겨진 시신
  지팡이 자국:
    곳: 숲길
    줄: 바퀴 자국 옆으로 지팡이 끝이 찍힌 작은 구멍이 줄지어 있었다.
    보여 주는 사실: 지팡이 짚은 사람
  여관 나무패:
    곳: 숲길
    줄: 징수관의 허리띠에 여관 '물레방아'의 나무패가 달려 있었다.
    보여 주는 사실: 여관의 징수관
    알리는 것: [여관 물레방아]
  영주의 명령서:
    곳: 숲길
    줄: 징수관의 품에 영주의 명령서가 있었다. "하늘에서 떨어진 자를 찾아 데려오라."
  쇠꼬챙이:
    곳: 여관 물레방아
    물건인가: 예
    소개: 녹슨 쇠꼬챙이. 손잡이에 천이 감겨 있다.
    성질: [가늘고 단단하다]
  가방의 쪽지:
    곳: 여관 물레방아
    줄: 징수관이 맡긴 가방에 쪽지가 있었다. "하스브룩 장부, 세 해 치가 모자람."
    보여 주는 사실: 빼돌린 세금
    나오는 조건: 말 브람.징수관.깨진 뒤
  장부 궤짝:
    곳: 촌장 집
    줄: 장부 궤짝이 잠겨 있었다.
    잠김:
      약점: 가늘고 단단하다
      단단한가: 예
      주인: 고드릭
      실마리: 자물쇠 구멍이 좁다. 가는 쇠붙이라면 돌아가겠다.
      안에 든 것: [장부 두 벌]
  장부 두 벌:
    줄: 숫자가 서로 다른 장부 두 벌이 있었다.
    보여 주는 사실: 빼돌린 세금
  약초 칼:
    곳: 약초꾼 오두막
    물건인가: 예
    소개: 약초를 캘 때 쓰는 작은 칼. 손잡이가 반들반들하다.
    성질: [가늘고 단단하다]

사람:
  고드릭:
    신상: 예순 가까운 촌장. 너그러운 척 하오체로 점잖게 말하고("그렇소", "모르겠구려"), 걸핏하면 마을 걱정을 내세운다.
    MBTI: ESTJ
    소개: 예순 가까운 마을 촌장.
    성질: [지팡이를 짚는다]
    가까운 사람: [마렌, 브람]
    있는 곳: 마을 사당
    하는 일:
      0: 의자에 앉아 지팡이 끝으로 바닥을 두드린다
      10: 뒷짐을 지고 서성이며 헛기침을 한다
    화제:
      징수관:
        자세: 거짓말한다
        감추는 까닭: 영주에게 들키면 목이 달아날 일을 덮고 있다.
        거짓말: 징수관은 해 지기 전에 장부만 걷고 바로 떠났다.
        깨는 사실: 촌장 집의 밤손님
        깨진 뒤:
          말: 밤에 집에서 장부를 맞췄다. 수고했다고 술을 한잔 냈다.
          보여 주는 사실: 촌장 집의 밤손님
          알리는 것: [촌장 집]
        묻는 말:
          - 징수관을 마지막으로 본 게 언제입니까?
          - 징수관은 무슨 일로 마을에 왔습니까?
          - 세금 걷는 나리를 만나셨습니까?
      술자리:
        자세: 거짓말한다
        감추는 까닭: 여기서 무너지면 끝장이라 끝까지 버틴다.
        거짓말: 그는 술을 마시고 멀쩡히 걸어 나갔다.
        깨는 사실: [밤에 나간 수레, 옮겨진 시신]
        깨진 뒤:
          말: 그가 내 집에서 쓰러졌다. 내가 수레에 실어 숲길에 두었다.
          보여 주는 사실: 옮겨진 시신
          알리는 것: [숲길]
        묻는 말:
          - 술을 마신 뒤에 징수관은 어떻게 됐습니까?
          - 그 사람은 댁에서 어떻게 나갔습니까?
          - 술자리가 끝나고 무슨 일이 있었습니까?
          - 징수관이 떠난 뒤로는 어떻게 되었습니까?
        나오는 조건: 말 고드릭.징수관.깨진 뒤
      새벽 종:
        자세: 숨기지 않는다
        참말: 새벽 네 시 종이 울리면 영주의 기사들이 온다. 그때까지 결백을 보이지 못하면 넘길 수밖에 없다.
        묻는 말:
          - 새벽 종이 울리면 어떻게 됩니까?
          - 기사들이 오면 저는 어떻게 됩니까?
          - 언제까지 결백을 밝혀야 합니까?
      마을 살림:
        자세: 숨기지 않는다
        참말: 하스브룩은 가난한 마을이다. 올해는 보리마저 흉년이었다.
        묻는 말:
          - 마을 형편은 어떻습니까?
          - 올해 농사는 어땠습니까?
          - 세금을 내기 버겁지 않습니까?
  마렌:
    신상: 촌장의 딸. 스물 남짓으로, 말끝을 흐리는 버릇이 있다.
    MBTI: INFP
    소개: 촌장의 딸. 스물 남짓이다.
    있는 곳: 촌장 집
    하는 일:
      0: 창가에 앉아 해진 옷을 깁고 있다
      12: 등잔 심지를 자꾸 돋우며 문 쪽을 살핀다
    화제:
      아버지:
        자세: 거짓말한다
        풀리는 인상: 위로
        풀리는 횟수: 2
        감추는 까닭: 무슨 일인지는 몰라도 아버지가 의심받을까 두렵다.
        거짓말: 아버지는 저녁 내내 사당에서 기도하셨다.
        깨는 사실: 빈 사당
        깨진 뒤:
          말: 징수관 나리가 집에 오셨었다. 내가 잔 둘을 내갔다.
          보여 주는 사실: 촌장 집의 밤손님
        묻는 말:
          - 아버지는 저녁에 어디 계셨습니까?
          - 촌장님은 밤에 무엇을 하셨습니까?
          - 아버지가 저녁에 집에 계셨습니까?
      마당:
        자세: 숨기지 않는다
        참말:
          말: 오늘은 수레 쓸 일이 없었는데, 아까 마당에 나가 보니 바퀴에 진흙이 잔뜩 묻어 있었다.
          보여 주는 사실: 밤에 나간 수레
        묻는 말:
          - 오늘 집에 별일은 없었습니까?
          - 오늘 마당에서 일하셨습니까?
          - 마당에 달라진 게 없었습니까?
  브람:
    신상: 여관 '물레방아'의 주인. 마흔 줄로 배가 나오고 목소리가 크며, 손님 비위를 잘 맞춘다. 하오체로 말한다("왔소", "없소", "모르오").
    MBTI: ESFP
    소개: 여관 '물레방아'의 주인. 마흔 줄이다.
    성질: [배가 나왔다]
    인상:
      눈감기: 밀주 같은 허물을 눈감아 주겠다고 한다
    있는 곳: 여관 물레방아
    하는 일:
      0: 탁자 사이를 오가며 빈 잔을 거둬들인다
      12: 카운터에 팔꿈치를 괴고 꾸벅꾸벅 존다
    처음 태도: {믿음: -1}
    화제:
      징수관:
        자세: 거짓말한다
        풀리는 인상: 눈감기
        감추는 까닭: 제 허물이 드러날까 두렵다.
        거짓말: 징수관은 우리 여관에 오지도 않았다.
        깨는 사실: 여관의 징수관
        깨진 뒤:
          말: 밀주를 들켜서 은화를 쥐여 줬다. 징수관은 장부를 맞추러 촌장 댁에 간다며 내게 가방을 맡겼다.
          보여 주는 사실: 촌장 집의 밤손님
          알리는 것: [촌장 집, 고드릭]
        묻는 말:
          - 징수관이 오늘 여관에 들렀습니까?
          - 세금 걷는 나리가 여기 오지 않았소?
          - 저녁에 낯선 손님은 없었습니까?
      독미나리:
        자세: 숨기지 않는다
        참말:
          말: 이 근방에서 독미나리를 다룰 줄 아는 건 넬 할멈뿐이다.
          보여 주는 사실: 독초를 아는 넬
          알리는 것: [넬]
        묻는 말:
          - 독초를 다룰 줄 아는 사람이 있습니까?
          - 이 근방에서 독을 구할 수 있습니까?
          - 약초에 밝은 사람이 누구입니까?
        나오는 조건: 볼 것 검푸른 입술
  넬:
    신상: 일흔이 넘은 약초꾼 할멈. 지팡이를 짚고 다니며, 퉁명스럽고 말이 짧다.
    MBTI: INTJ
    소개: 일흔이 넘은 약초꾼 할멈.
    성질: [지팡이를 짚는다]
    가까운 사람: [토빈]
    있는 곳: 약초꾼 오두막
    하는 일:
      0: 처마 밑에서 말린 풀 다발을 뒤집어 건다
      12: 화롯가에서 졸다 깨다 한다
    처음 태도: {믿음: -1}
    화제:
      시신:
        자세: 꺼린다
        풀리는 인상: 칭찬
        풀린 뒤:
          말: 목 자국에 피멍이 없으니 죽은 뒤에 생긴 것이다. 입술이 검푸른 걸 보니 독미나리다.
          보여 주는 사실: 독미나리 독
        바라는 것: 옮겨진 시신
        실마리: 그 사람이 거기서 죽었다고 누가 그러던가?
        묻는 말:
          - 시신을 살펴보셨습니까?
          - 죽은 사람은 어땠습니까?
          - 목에 난 자국은 무엇 때문입니까?
      해 질 녘:
        자세: 숨기지 않는다
        참말:
          말: 해 질 녘에 징수관이 여관 쪽으로 가는 걸 봤다.
          보여 주는 사실: 여관의 징수관
          알리는 것: [여관 물레방아]
        묻는 말:
          - 오늘 저녁에 징수관을 보셨습니까?
          - 해 질 무렵 누가 지나가던가요?
          - 저녁에 여관 쪽으로 간 사람이 있습니까?
      독미나리:
        자세: 숨기지 않는다
        참말:
          말: 독미나리는 술에 타면 맛이 감쪽같다. 지난달 쥐를 잡는다며 촌장이 한 줌 얻어 갔다.
          보여 주는 사실: 독미나리 독
          알리는 것: [고드릭]
        묻는 말:
          - 독미나리에 대해 아십니까?
          - 입술이 검푸르게 변하는 독이 있습니까?
          - 그 풀은 얼마나 위험합니까?
        나오는 조건: 볼 것 검푸른 입술
  토빈:
    신상: 나무꾼의 아들. 열두 살로 겁이 많지만, 본 것은 다 기억한다.
    MBTI: ISFJ
    소개: 나무꾼의 아들. 열두 살이다.
    있는 곳: 숲길
    하는 일:
      0: 나무 뒤에 반쯤 숨어 시신 쪽을 힐끔거린다
      8: 웅크리고 앉아 손을 호호 불며 추위를 견딘다
    화제:
      사당:
        자세: 숨기지 않는다
        참말:
          말: 저녁 일곱 시쯤 사당 앞을 지났는데 안이 깜깜했다.
          보여 주는 사실: 빈 사당
          알리는 것: [마을 사당]
        묻는 말:
          - 저녁에 사당 쪽에 가 봤니?
          - 사당에 불이 켜져 있었니?
          - 일곱 시쯤 어디를 지나갔니?
      넬 할머니:
        자세: 숨기지 않는다
        참말:
          말: 넬 할머니는 저녁 내내 오두막 화롯가에 계셨어요. 제가 땔감을 갖다 드렸거든요.
          보여 주는 사실: 오두막의 넬
          알리는 것: [넬]
        묻는 말:
          - 넬 할머니는 저녁에 어디 계셨니?
          - 약초꾼 할머니를 오늘 봤니?
          - 저녁에 오두막에 누가 있었니?
      숲길에서 본 것:
        자세: 꺼린다
        풀리는 인상: 다정
        풀린 뒤:
          말: 밤에 촌장님 댁 수레가 숲길로 나갔다. 그 집 개가 따라가는데 한 번도 안 짖었다.
          보여 주는 사실: 밤에 나간 수레
          알리는 것: [촌장 집]
        바라는 것: 조른 자국이 아니다
        거드는 것: [옮겨진 시신]
        실마리: 아저씨가 목을 조른 게 아니라면 말할게요.
        묻는 말:
          - 숲길에서 뭘 봤니?
          - 그날 밤 숲에서 무슨 일이 있었니?
          - 밤늦게 숲에 누가 오지 않았니?

번진 일:
  - 때: 10
    일:
      - 옮긴다: [고드릭, 촌장 집]
      - 없어진다: 장부 두 벌
    막는 조건: 거짓말 마렌.아버지
    부르는 것: 거짓말 브람.징수관
    뒤: 2
    조짐: 촌장 집 굴뚝에서 연기가 오르기 시작한다.
    벌어졌을 때: 촌장 집 아궁이에 재가 수북하다.
    막았을 때: 마렌이 궤짝을 안고 기사들 앞에 선다.
  - 때: 16
    일:
      - 떠난다: 토빈
    막는 조건: 꺼림 토빈.숲길에서 본 것
    조짐: 숲 쪽에서 토빈을 부르는 아버지의 목소리가 들린다.
    벌어졌을 때: 산길 위로 나무꾼 부자의 등불이 멀어진다.
    막았을 때: 토빈이 당신의 벨트를 신기한 듯 만져 본다.

결말:
  다 밝혔다: 새벽 종과 함께 온 기사들 앞에서 당신이 수첩을 편다. 독미나리, 빼돌린 세금, 그리고 촌장의 이름.
  누구인지는 밝혔다: 당신이 촌장을 지목하지만 수법이나 까닭이 비어 있다. 기사들은 둘을 함께 묶어 간다.
  엉뚱한 사람을 짚었다: 당신이 짚은 사람이 끌려가고, 촌장은 고개를 숙여 기사들을 배웅한다.
  밝히지 못했다: 당신은 쫄쫄이 차림 그대로 기사들에게 끌려간다.
  진실 풀이: 고드릭은 세 해 동안 영주에게 바칠 세금을 덜 올리고 차액을 빼돌렸다. 해 질 녘 마을에 온 징수관 에드윈은 여관에 들렀다가 밤에 장부를 맞추러 촌장 집에 갔다. 장부가 맞지 않자 고드릭은 독미나리를 탄 술을 대접했고, 에드윈이 죽자 시신을 수레에 실어 숲길에 버렸다. 목의 자국은 그때 수레 끈에 쓸려 생긴 것이다. 그 길에 떨어진 당신을 고드릭은 범인으로 몰았다. 그런데 징수관이 지닌 명령서의 "하늘에서 떨어진 자"는 누구이고, 영주는 왜 그를 찾는가.
