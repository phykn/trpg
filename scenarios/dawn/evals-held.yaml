# 알아듣기 시험의 확인용 몫(engine/01 5절). AI 테스터가 실제로 친 문장이다. 묻는 말이나 프롬프트를 고칠 때 보지 않고, 점수만 잰다.

사람 고드릭:
  인상 없음:
    - 마을 형편은 어떻습니까?
  징수관:
    - 고드릭 님, 오늘 저녁 징수관을 이 집에서 만나셨습니까?
    - 징수관 에드윈은 어떤 사람이었나요?
    - 징수관은 언제 떠났습니까?
    - 죽은 사람이 혹시 그 징수관입니까?
    - 에드윈에 대해 아는 것을 말해 주십시오.
  마을 살림:
    - 마을 살림은 어떤가요?
  잡담:
    - 야 너 이름이 뭐냐 대머리야
  넘김:
    - 제단의 초는 왜 새것인가요?

사람 마렌:
  아버지:
    - 오늘 밤 아버님 고드릭 님은 어디에 계셨습니까?
    - 오늘 밤 아버지께서 손님에게 술을 대접하셨습니까?
    - 마렌, 오늘 밤 징수관이 이 집에 왔습니까?
  넘김:
    - 저 장부 궤짝 열쇠는 어디 있어요?

사람 브람:
  인상 없음:
    - 징수관이 오늘 여관에 들렀습니까?
  징수관:
    - 징수관이 여기 들렀었나요?
    - 오늘 밤 징수관을 봤어요?
    - 오늘 밤 여관에 손님은 누가 있었어요?
  넘김:
    - 이 쇠꼬챙이는 뭐예요?

사람 넬:
  인상 없음:
    - 독초를 다룰 줄 아십니까?
  독미나리:
    - 독미나리는 누가 가져갔어요?
    - 요즘 누가 할머니한테 약초나 독초를 사 갔어요?
  해 질 녘:
    - 징수관 에드윈이 오늘 이 오두막에 왔었습니까?
  잡담:
    - 할멈, 내 운세 좀 봐 주쇼. 나 오늘 결백 밝힐 수 있소?

사람 토빈:
  인상 무례:
    - 넌 뭐냐
  숲길에서 본 것:
    - 오늘 밤에 수레가 지나가는 걸 봤니?
    - 오늘 밤 이 숲길에 누가 지나가는 걸 봤습니까?
    - 토빈, 무서워하지 마. 여기서 뭘 봤어?
  사당:
    - 사당에서 본 것도 있어? 그것도 말해 줘.
    - 아니, 사당에서 본 거.

곳 마을 사당:
  둘러봄:
    - 에드윈에 대해 아는 것을 말해 주십시오.
